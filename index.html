<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win7Simu Launcher</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            text-align: center;
            cursor: pointer;
        }
        .box {
            border: 2px solid #0078d7;
            padding: 30px;
            border-radius: 12px;
            background: #111;
        }
        h1 { margin-bottom: 10px; font-size: 24px; }
        p { color: #aaa; font-size: 14px; }
    </style>
</head>
<body onclick="openFullscreen()">

    <div class="box">
        <h1>Tik om Win7Simu te starten</h1>
        <p>Volledig scherm wordt geactiveerd...</p>
    </div>

    <script>
        function openFullscreen() {
            const elem = document.documentElement;

            // Activeer volledig scherm op de browser
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }

            // Stuur direct door naar de site (geen iframe)
            setTimeout(() => {
                window.location.href = "https://win7simu.visnalize.com";
            }, 100);
        }
    </script>

</body>
</html>
