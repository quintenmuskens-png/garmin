<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win7Simu - Volledig Scherm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #winFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        #startContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            flex-direction: column;
            gap: 20px;
        }
        .start-btn {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .start-btn:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>

    <div id="startContainer">
        <h1>Win7Simu Starten</h1>
        <button class="start-btn" onclick="startFullscreen()">Open in Volledig Scherm</button>
    </div>

    <iframe id="winFrame" src="https://win7simu.visnalize.com" allowfullscreen></iframe>

    <script>
        function startFullscreen() {
            const elem = document.documentElement;
            const container = document.getElementById('startContainer');
            const iframe = document.getElementById('winFrame');

            // Vraag volledig scherm aan
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }

            // Verberg de startknop en toon het iframe
            container.style.display = 'none';
            iframe.style.display = 'block';
        }
    </script>

</body>
</html>
